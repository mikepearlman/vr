name: VRPlayer
options:
  bundleIdPrefix: com.mikepearlman
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7NXF7EKRNY
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "2"
targets:
  VRPlayer:
    type: application
    platform: iOS
    sources:
      - path: VRPlayer
        excludes: ["**/*.test.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikepearlman.vrplayer.ios
        INFOPLIST_FILE: VRPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MetalKit.framework
      - sdk: PhotosUI.framework
      - sdk: AuthenticationServices.framework
  VRPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VRPlayerTests
    dependencies:
      - target: VRPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VRPlayer:
    build:
      targets:
        VRPlayer: all
    test:
      targets: [VRPlayerTests]
